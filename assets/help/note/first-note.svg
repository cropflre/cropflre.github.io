<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">创建第一篇笔记流程</title><desc id="d">选择目录、新建笔记、输入内容、插入图片、等待保存、重新打开验证。</desc><rect width="1200" height="520" rx="30" fill="#f7f8fc"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202435">第一次写笔记，建议完整测试 6 个环节</text><g font-family="Arial,sans-serif"><g transform="translate(70 130)"><rect width="150" height="210" rx="18" fill="#fff" stroke="#e5e7f0"/><circle cx="75" cy="55" r="27" fill="#eeeaff"/><text x="75" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#6658f5">1</text><text x="75" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#262a3d">选择目录</text><text x="75" y="141" text-anchor="middle" font-size="11" fill="#737b90">工作 / 学习 / 生活</text></g><path d="M232 235h42" stroke="#b9bfd0" stroke-width="2"/><path d="m267 229 9 6-9 6" fill="none" stroke="#b9bfd0" stroke-width="2"/><g transform="translate(286 130)"><rect width="150" height="210" rx="18" fill="#fff" stroke="#e5e7f0"/><circle cx="75" cy="55" r="27" fill="#eef4ff"/><text x="75" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#3e7bfa">2</text><text x="75" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#262a3d">新建笔记</text><text x="75" y="141" text-anchor="middle" font-size="11" fill="#737b90">富文本 / Markdown</text></g><path d="M448 235h42" stroke="#b9bfd0" stroke-width="2"/><path d="m483 229 9 6-9 6" fill="none" stroke="#b9bfd0" stroke-width="2"/><g transform="translate(502 130)"><rect width="150" height="210" rx="18" fill="#fff" stroke="#e5e7f0"/><circle cx="75" cy="55" r="27" fill="#ecfbf4"/><text x="75" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#18a56b">3</text><text x="75" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#262a3d">输入内容</text><text x="75" y="141" text-anchor="middle" font-size="11" fill="#737b90">标题 / 正文 / 标签</text></g><path d="M664 235h42" stroke="#b9bfd0" stroke-width="2"/><path d="m699 229 9 6-9 6" fill="none" stroke="#b9bfd0" stroke-width="2"/><g transform="translate(718 130)"><rect width="150" height="210" rx="18" fill="#fff" stroke="#e5e7f0"/><circle cx="75" cy="55" r="27" fill="#fff4e8"/><text x="75" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#e9872f">4</text><text x="75" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#262a3d">插入图片</text><text x="75" y="141" text-anchor="middle" font-size="11" fill="#737b90">验证附件链路</text></g><path d="M880 235h42" stroke="#b9bfd0" stroke-width="2"/><path d="m915 229 9 6-9 6" fill="none" stroke="#b9bfd0" stroke-width="2"/><g transform="translate(934 130)"><rect width="196" height="210" rx="18" fill="#fff" stroke="#e5e7f0"/><circle cx="98" cy="55" r="27" fill="#fcecef"/><text x="98" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#db4d5e">5-6</text><text x="98" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#262a3d">等待保存并复查</text><text x="98" y="141" text-anchor="middle" font-size="11" fill="#737b90">切换笔记 → 再返回</text><rect x="36" y="166" width="124" height="26" rx="13" fill="#ecfbf4"/><text x="98" y="183" text-anchor="middle" font-size="10" font-weight="700" fill="#18a56b">内容仍在 = 链路通过</text></g><rect x="70" y="390" width="1060" height="64" rx="16" fill="#fff" stroke="#e5e7f0"/><text x="92" y="418" font-size="12" font-weight="700" fill="#6658f5">为什么第一次要测试图片？</text><text x="92" y="440" font-size="12" fill="#737b90">因为正文保存正常并不代表附件路径、存储映射、签名地址和客户端访问一定正常。第一次就把这条链路验证掉。</text></g></svg>