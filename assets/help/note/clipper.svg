<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Nowen Note 浏览器剪藏流程</title><desc id="d">网页通过剪藏扩展和 API Token 保存到指定 Nowen Note 目录。</desc><rect width="1200" height="520" rx="30" fill="#f7f8fc"/><g font-family="Arial,sans-serif"><text x="70" y="72" font-size="18" font-weight="700" fill="#202435">浏览器剪藏：网页 → 扩展 → Nowen Note</text><rect x="70" y="135" width="280" height="270" rx="22" fill="#fff" stroke="#e5e7f0"/><rect x="92" y="158" width="236" height="34" rx="10" fill="#f1f3f8"/><circle cx="110" cy="175" r="5" fill="#ff6b67"/><circle cx="126" cy="175" r="5" fill="#ffc651"/><circle cx="142" cy="175" r="5" fill="#38c87a"/><rect x="96" y="219" width="92" height="12" rx="6" fill="#dfe2eb"/><rect x="96" y="246" width="196" height="10" rx="5" fill="#eceef4"/><rect x="96" y="270" width="178" height="10" rx="5" fill="#eceef4"/><rect x="96" y="294" width="208" height="10" rx="5" fill="#eceef4"/><rect x="96" y="326" width="130" height="50" rx="10" fill="#eef4ff"/><text x="210" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#262a3d">正在浏览的网页</text><path d="M372 270h116" stroke="#b9bfd0" stroke-width="3"/><path d="m477 262 14 8-14 8" fill="none" stroke="#b9bfd0" stroke-width="3"/><rect x="505" y="135" width="250" height="270" rx="22" fill="#fff" stroke="#e5e7f0"/><circle cx="630" cy="190" r="34" fill="#eeeaff"/><text x="630" y="198" text-anchor="middle" font-size="24" font-weight="700" fill="#6658f5">N</text><text x="630" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#262a3d">Web Clipper</text><rect x="545" y="274" width="170" height="34" rx="10" fill="#f5f6fa"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#737b90">正文 / 选区 / 整页 / 截图</text><rect x="545" y="322" width="170" height="34" rx="10" fill="#ecfbf4"/><text x="630" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#18a56b">独立 API Token</text><path d="M777 270h116" stroke="#b9bfd0" stroke-width="3"/><path d="m882 262 14 8-14 8" fill="none" stroke="#b9bfd0" stroke-width="3"/><rect x="910" y="135" width="220" height="270" rx="22" fill="#fff" stroke="#e5e7f0"/><rect x="944" y="175" width="152" height="54" rx="13" fill="#eeeaff"/><text x="1020" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#6658f5">Nowen Note</text><text x="944" y="267" font-size="11" font-weight="700" fill="#262a3d">保存到指定目录</text><text x="944" y="294" font-size="11" fill="#737b90">✓ 自动添加标签</text><text x="944" y="320" font-size="11" fill="#737b90">✓ 图片本地化</text><text x="944" y="346" font-size="11" fill="#737b90">✓ 后续 AI 整理</text><rect x="70" y="446" width="1060" height="45" rx="13" fill="#fff4e8"/><text x="92" y="474" font-size="11" font-weight="700" fill="#e9872f">长期保存网页图片时建议选择“下载为本地”，否则源站图片失效、删除或防盗链后可能无法继续显示。</text></g></svg>