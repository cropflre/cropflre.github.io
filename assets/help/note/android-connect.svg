<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Android 连接 Nowen Note</title><desc id="d">手机通过局域网 IP 或 HTTPS 域名连接 NAS 上的 Nowen Note 服务。</desc><rect width="1200" height="520" rx="30" fill="#f7f8fc"/><g font-family="Arial,sans-serif"><text x="70" y="72" font-size="18" font-weight="700" fill="#202435">Android 连接 NAS：地址要从“手机视角”填写</text><rect x="90" y="135" width="240" height="300" rx="34" fill="#202435"/><rect x="108" y="158" width="204" height="250" rx="22" fill="#fff"/><rect x="132" y="185" width="156" height="44" rx="12" fill="#f3f4f8"/><text x="148" y="211" font-size="11" fill="#737b90">服务器地址</text><rect x="132" y="244" width="156" height="48" rx="12" fill="#eeeaff"/><text x="145" y="273" font-size="11" font-weight="700" fill="#6658f5">192.168.1.20:3001</text><rect x="132" y="310" width="156" height="42" rx="12" fill="#6658f5"/><text x="210" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">连接并登录</text><text x="210" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#262a3d">Android App</text><path d="M365 285h165" stroke="#b9bfd0" stroke-width="3" stroke-dasharray="8 8"/><path d="m519 277 14 8-14 8" fill="none" stroke="#b9bfd0" stroke-width="3"/><text x="448" y="265" text-anchor="middle" font-size="11" fill="#737b90">Wi-Fi / IPv6 / HTTPS</text><rect x="565" y="145" width="260" height="260" rx="24" fill="#fff" stroke="#e5e7f0"/><rect x="600" y="184" width="190" height="150" rx="18" fill="#f1f3f8"/><rect x="623" y="208" width="144" height="98" rx="12" fill="#fff" stroke="#e5e7f0"/><circle cx="649" cy="239" r="9" fill="#18a56b"/><rect x="670" y="231" width="70" height="8" rx="4" fill="#dfe2eb"/><rect x="642" y="265" width="98" height="9" rx="4" fill="#e9ebf2"/><text x="695" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#262a3d">NAS / 服务器</text><text x="695" y="388" text-anchor="middle" font-size="11" fill="#737b90">Nowen Note :3001</text><rect x="866" y="145" width="264" height="260" rx="24" fill="#fff" stroke="#e5e7f0"/><text x="892" y="183" font-size="12" font-weight="700" fill="#db4d5e">最常见错误</text><rect x="892" y="207" width="212" height="48" rx="12" fill="#fcecef"/><text x="998" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#db4d5e">localhost:3001 ✕</text><text x="892" y="286" font-size="11" fill="#737b90">在手机里 localhost 指手机自己，</text><text x="892" y="307" font-size="11" fill="#737b90">不是 NAS，也不是你的电脑。</text><text x="892" y="345" font-size="11" font-weight="700" fill="#18a56b">正确做法</text><text x="892" y="368" font-size="11" fill="#737b90">NAS 局域网 IP / IPv6 / HTTPS 域名</text></g></svg>