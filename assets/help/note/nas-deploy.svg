<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Nowen Note NAS 部署流程</title><desc id="d">创建容器、映射端口、映射 app data、启动、验证和备份。</desc><rect width="1200" height="520" rx="30" fill="#f7f8fc"/><text x="70" y="72" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202435">NAS 部署的核心只有 5 步</text><text x="70" y="99" font-family="Arial,sans-serif" font-size="12" fill="#737b90">群晖、绿联、飞牛、威联通、极空间的 UI 不同，但底层配置逻辑一致。</text><g font-family="Arial,sans-serif"><rect x="70" y="145" width="190" height="180" rx="18" fill="#fff" stroke="#e5e7f0"/><text x="96" y="180" font-size="12" font-weight="700" fill="#6658f5">01 · 创建项目</text><text x="96" y="220" font-size="14" font-weight="700" fill="#262a3d">Docker / Compose</text><text x="96" y="247" font-size="11" fill="#737b90">使用官方镜像或仓库</text><rect x="286" y="145" width="190" height="180" rx="18" fill="#fff" stroke="#e5e7f0"/><text x="312" y="180" font-size="12" font-weight="700" fill="#3e7bfa">02 · 映射端口</text><text x="312" y="220" font-size="22" font-weight="700" fill="#262a3d">3001</text><text x="312" y="247" font-size="11" fill="#737b90">冲突时改主机端口</text><rect x="502" y="145" width="190" height="180" rx="18" fill="#fff" stroke="#e5e7f0"/><text x="528" y="180" font-size="12" font-weight="700" fill="#18a56b">03 · 持久化</text><text x="528" y="220" font-size="18" font-weight="700" fill="#262a3d">/app/data</text><text x="528" y="247" font-size="11" fill="#737b90">映射到 NAS 实体目录</text><rect x="718" y="145" width="190" height="180" rx="18" fill="#fff" stroke="#e5e7f0"/><text x="744" y="180" font-size="12" font-weight="700" fill="#e9872f">04 · 启动服务</text><text x="744" y="220" font-size="13" font-weight="700" fill="#262a3d">http://NAS-IP:3001</text><text x="744" y="247" font-size="11" fill="#737b90">浏览器先验证</text><rect x="934" y="145" width="196" height="180" rx="18" fill="#fff" stroke="#e5e7f0"/><text x="960" y="180" font-size="12" font-weight="700" fill="#db4d5e">05 · 重启验证</text><text x="960" y="220" font-size="14" font-weight="700" fill="#262a3d">笔记 + 图片仍存在</text><text x="960" y="247" font-size="11" fill="#737b90">确认映射没有配错</text><path d="M260 235h26M476 235h26M692 235h26M908 235h26" stroke="#b9bfd0" stroke-width="2"/><rect x="70" y="370" width="1060" height="86" rx="17" fill="#fff" stroke="#e5e7f0"/><text x="94" y="402" font-size="12" font-weight="700" fill="#db4d5e">上线前不要漏掉</text><text x="94" y="430" font-size="12" fill="#737b90">修改默认管理员密码 · 公网访问使用 HTTPS · 创建完整备份 · 记录当前 Compose / 环境变量</text></g></svg>