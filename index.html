<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="description" content="Nowen 帮助中心：Nowen Note（弄文笔记）、Nowen Reader、Nowen Video、NOWEN 书签的使用教程、部署指南、NAS 指南与常见问题。" />
  <meta name="keywords" content="Nowen Note,弄文笔记,Nowen Reader,Nowen Video,NOWEN书签,帮助中心,使用教程,NAS,Docker,自托管,MCP" />
  <meta property="og:title" content="Nowen 帮助中心" />
  <meta property="og:description" content="Nowen 系列产品的使用教程、部署指南与问题解答。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cropflre.github.io/" />
  <title>Nowen 帮助中心 · 使用教程与问题解答</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/help-v2.css" />
  <script>
    (() => {
      const saved = localStorage.getItem('nowen-help-theme');
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <script defer src="assets/js/help-data-v2.js"></script>
  <script defer src="assets/js/help-app-v2.js"></script>
</head>
<body>
  <a class="skip-link" href="#appMain">跳到主要内容</a>

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Nowen 帮助中心首页">
        <span class="brand-mark">N</span>
        <span class="brand-copy">NOWEN <small>帮助中心</small></span>
      </a>

      <div class="global-search" role="search">
        <div class="search-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="globalSearch" type="search" autocomplete="off" placeholder="搜索教程、功能或问题…" aria-label="搜索帮助中心" />
          <kbd>Ctrl K</kbd>
        </div>
        <div class="search-results" id="searchResults" aria-live="polite"></div>
      </div>

      <nav class="header-actions" aria-label="顶部导航">
        <a class="header-link" href="http://nowen.cn/" target="_blank" rel="noopener">官网</a>
        <a class="header-link" href="https://github.com/cropflre" target="_blank" rel="noopener">GitHub</a>
        <button class="icon-btn mobile-menu-btn" id="mobileMenu" type="button" aria-label="打开教程目录">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深浅色模式">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 1 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="appMain" tabindex="-1"></main>

  <noscript>Nowen 帮助中心需要启用 JavaScript 才能使用全文搜索和教程导航。</noscript>
</body>
</html>
