name: Deploy NOWEN Guestbook Worker (one-time, requested)

on:
  push:
    branches:
      - ops/guestbook-worker-deploy-20261028

permissions:
  contents: read

concurrency:
  group: nowen-site-stats-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'cropflre/cropflre.github.io' && github.ref == 'refs/heads/ops/guestbook-worker-deploy-20261028'
    name: Deploy existing nowen-site-stats Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed master source (pinned)
        uses: actions/checkout@v4
        with:
          ref: 90d935b554a4ef4eaa510ae6e5ed61f59a5e3c50
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo '::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret'
            exit 1
          fi

      - name: Worker and guestbook unit tests
        run: |
          node --check workers/site-stats/src/index.mjs
          node --check workers/site-stats/src/guestbook.mjs
          node --test tests/site-stats-worker.test.mjs tests/guestbook-worker.test.mjs tests/guestbook-static.test.cjs

      - name: Verify existing D1 schema before deploying
        working-directory: workers/site-stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.154.0 d1 execute nowen-site-stats --remote --command 'SELECT pv, uv FROM site_counters WHERE id=1'
          npx --yes wrangler@4.154.0 d1 execute nowen-site-stats --remote --command 'SELECT id FROM guestbook_messages LIMIT 0'

      - name: Deploy existing Worker (secrets are retained)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.154.0'
          workingDirectory: workers/site-stats
          command: deploy

      - name: Read-only production API smoke checks
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors --max-time 15 \
            https://nowen-site-stats.cropflre2333.workers.dev/api/stats | jq -e '.pv >= 0 and .uv >= 0'
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors --max-time 15 \
            https://nowen-site-stats.cropflre2333.workers.dev/api/guestbook/messages | jq -e '(.items | type == "array") and (.page == 1)'
