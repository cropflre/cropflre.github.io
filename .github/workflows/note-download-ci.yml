name: Note download center CI
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/note-release-v1.js
          node --check assets/js/note-site-v1.js
          node --check assets/js/help-app-v3.js
          node --check assets/js/nowen-ui-v2.js
          node --check assets/js/site-visits.js
          node --check assets/js/site-visits-config.js
          node --check workers/site-stats/src/index.mjs
          node --check workers/site-stats/src/guestbook.mjs
          node --check assets/js/guestbook.js
          node --check assets/js/guestbook-admin.js
          node --check assets/js/guestbook-config.js
      - name: Release and route contract tests
        run: node --test tests/download-center.test.cjs tests/privacy-policy.test.cjs tests/icp-footer.test.cjs tests/site-visits.test.cjs tests/site-stats-worker.test.mjs tests/guestbook-worker.test.mjs tests/guestbook-static.test.cjs
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Browser smoke tests (Chromium / Firefox / WebKit)
        run: node --test --test-concurrency=1 tests/browser-smoke.test.cjs tests/guestbook-browser.test.cjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-site-visual-review
          path: test-artifacts/*.png
          if-no-files-found: ignore
